<svg xmlns="http://www.w3.org/2000/svg" width="680" height="218" viewBox="0 0 680 218" role="img" aria-labelledby="title desc" font-family="Lato, sans-serif" data-figure-typography="lato-v1" data-figure-render-width="640">
  <title id="title">Two ways to score a variant with a frozen genomic language model</title>
  <desc id="desc">Reference and alternate sequences differ at one base. The zero-shot damage score is the negative mean of the forward and reverse-complement alternate-minus-reference log-likelihood ratios. Only the linear probe uses labeled variants. Its inputs are the pooled reference embedding and the alternate embedding minus the reference embedding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#8a7d68"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="216" rx="14" fill="#f6f0e4" stroke="#ddd3bf"/>
  <rect x="10" y="27" width="134" height="164" rx="12" fill="#fcfaf5" stroke="#d9cbb1"/>
  <g fill="#465c6e" font-size="18" font-weight="700">
    <text x="19" y="56">REFERENCE</text>
    <text x="19" y="135">ALTERNATE</text>
  </g>
  <path d="M77 92 V113" fill="none" stroke="#a89a80" stroke-width="1.3" stroke-dasharray="3 3"/>
  <g fill="#e9edf0" stroke="#8394a1">
    <rect x="69" y="63" width="17" height="26" rx="3"/>
    <rect x="69" y="142" width="17" height="26" rx="3"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" text-anchor="middle" fill="#1f1e1b">
    <text x="69" y="83" text-anchor="end">ACGT</text>
    <text x="77" y="83" font-weight="bold" fill="#465c6e">C</text>
    <text x="85" y="83" text-anchor="start">GTCA</text>
    <text x="69" y="162" text-anchor="end">ACGT</text>
    <text x="77" y="162" font-weight="bold" fill="#465c6e">T</text>
    <text x="85" y="162" text-anchor="start">GTCA</text>
  </g>

  <g fill="none" stroke="#8a7d68" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M145 109 H163"/>
    <path d="M282 109 H301 V57 H319"/>
    <path d="M301 109 V161 H319"/>
  </g>
  <circle cx="301" cy="109" r="3" fill="#8a7d68"/>
  <rect x="166" y="63" width="116" height="92" rx="12" fill="#fcfaf5" stroke="#bdc7cf"/>
  <circle cx="224" cy="94" r="19" fill="#e9edf0"/>
  <text x="224" y="105" text-anchor="middle" data-figure-preserve-typography="true" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#465c6e">❄</text>
  <text x="224" y="137" text-anchor="middle" font-size="19.5" font-weight="700" fill="#1f1e1b">Frozen gLM</text>

  <rect x="323" y="9" width="347" height="96" rx="12" fill="#fcfaf5" stroke="#dbc4b5"/>
  <rect x="323" y="9" width="6" height="96" rx="3" fill="#9c4f2f"/>
  <text x="339" y="35" font-size="18" font-weight="700" fill="#9c4f2f">ZERO-SHOT</text>
  <text x="339" y="64" font-size="20" font-weight="700" fill="#1f1e1b">Damage score = −mean strand LLR</text>
  <text x="339" y="88" font-size="18" fill="#5b3424">Higher when ALT is less likely than REF</text>

  <rect x="323" y="113" width="347" height="96" rx="12" fill="#fcfaf5" stroke="#b9d2ca"/>
  <rect x="323" y="113" width="6" height="96" rx="3" fill="#2f6f63"/>
  <text x="339" y="139" font-size="18" font-weight="700" fill="#2f6f63">LINEAR PROBE</text>
  <text x="339" y="168" font-size="20" font-weight="700" fill="#1f1e1b">Fit on labeled variants</text>
  <text x="339" y="193" font-size="18" fill="#315f56">Pooled embeddings  [REF, ALT − REF]</text>
</svg>
