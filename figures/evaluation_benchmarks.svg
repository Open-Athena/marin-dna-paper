<svg xmlns="http://www.w3.org/2000/svg" width="560" height="245" viewBox="0 0 560 245" role="img" aria-labelledby="title desc" font-family="Lato, sans-serif">
  <title id="title">How variants receive their benchmark labels</title>
  <desc id="desc">Clinical disease records and matched population controls define Mendelian labels. Endogenous editing assays and study-specific calibrations define SGE labels.</desc>
  <g fill="#1f1e1b" font-size="16">
    <rect x="1" y="1" width="273" height="242" rx="8" fill="#f8f4ed" stroke="#ddd3bf"/>
    <rect x="285" y="1" width="274" height="242" rx="8" fill="#f2f6f3" stroke="#cbd9d1"/>
    <g font-size="20" font-weight="bold">
      <text x="14" y="31">Mendelian disease</text>
      <text x="299" y="31">Saturation genome editing</text>
    </g>
    <g fill="#73593b" font-weight="bold">
      <text x="14" y="68">Disease records</text>
      <text x="14" y="141">Population controls</text>
    </g>
    <text x="14" y="94">OMIM, Smedley et al., HGMD</text>
    <text x="14" y="116">Rare pathogenic SNVs</text>
    <text x="14" y="167">Nine gnomAD SNVs matched</text>
    <text x="14" y="189">to each pathogenic variant</text>
    <g fill="#305e50" font-weight="bold">
      <text x="299" y="68">Functional measurements</text>
      <text x="299" y="141">Assay calibration</text>
    </g>
    <text x="299" y="94">Edits at endogenous loci</text>
    <text x="299" y="116">Cell fitness or proliferation</text>
    <text x="299" y="167">Apply study-specific thresholds</text>
    <text x="299" y="189">or author classifications</text>
    <path d="M14 204 H260 M299 204 H545" fill="none" stroke="#c5bfb4"/>
    <g font-weight="bold">
      <text x="14" y="229">Pathogenic vs. control</text>
      <text x="299" y="229">Abnormal vs. normal</text>
    </g>
  </g>
</svg>
